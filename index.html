    // --- SLIDES BUILDER ---
    function buildModelSlides(model) {
      const s = [];

      // Presentationsfilm 1 (Huvudvideo) som Slide 1
      if (model.showreelVideoUrl) {
        s.push({
          type: 'SHOWREEL',
          id: 'showreel-1',
          title: `${model.name} — Presentationsfilm`,
          subtitle: model.secondaryShowreelVideoUrl ? 'Officiell Presentation' : 'Modellens Huvudvideo',
          videoUrl: model.showreelVideoUrl
        });
      }

      // Presentationsfilm 2 (Vit Klänning / Showcase) som Slide 2
      if (model.secondaryShowreelVideoUrl) {
        s.push({
          type: 'SHOWREEL',
          id: 'showreel-2',
          title: `${model.name} — Presentationsfilm 2`,
          subtitle: 'Vit Klänning / Showcase',
          videoUrl: model.secondaryShowreelVideoUrl
        });
      }

      // Modell Hero
      s.push({
        type: 'HERO',
        id: 'hero',
        title: model.name,
        subtitle: model.role,
        definition: model.definition,
        values: model.coreValues,
        image: model.themeImageUrl,
        logo: model.logoUrl
      });

      (model.professions || []).forEach((p, pIdx) => {
        s.push({
          type: 'TITLE',
          id: `title-${p.id}`,
          title: p.title,
          desc: p.description,
          history: p.history,
          chapter: `0${pIdx + 1}`
        });

        if (p.presentationVideoUrl) {
          s.push({
            type: 'VIDEO',
            id: `video-${p.id}`,
            title: `${p.title} — Videopresentation`,
            subtitle: p.description,
            videoUrl: p.presentationVideoUrl,
            ctx: p.title
          });
        }

        (p.media || []).forEach((m, mIdx) => {
          s.push({
            type: 'IMAGE',
            id: `media-${p.id}-${mIdx}-${m.id}`,
            url: m.url,
            caption: m.caption,
            ctx: p.title,
            indexNumber: `0${pIdx + 1}.${mIdx + 1}`
          });
        });
      });

      return s;
    }

    // --- FULLSCREEN KEYNOTE PRESENTATION ---
    function KeynotePresentation({ model, initialSlide = 0, onClose }) {
      const slides = useMemo(() => buildModelSlides(model), [model]);
      const [current, setCurrent] = useState(initialSlide);
      const [isPlaying, setIsPlaying] = useState(true);
      const [isMuted, setIsMuted] = useState(false);
      const [isAudioBlocked, setIsAudioBlocked] = useState(false);
      const [isAudioFading, setIsAudioFading] = useState(false);
      const [progress, setProgress] = useState(0);
      const audioRef = useRef(null);
      const fadeIntervalRef = useRef(null);

      const slide = slides[current] || slides[0];
      const isVideoSlide = slide && (slide.type === 'SHOWREEL' || slide.type === 'VIDEO');

      const setSafeVolume = (vol) => {
        if (!audioRef.current) return;
        try {
          audioRef.current.volume = Math.max(0, Math.min(1, vol));
        } catch(e) {}
      };

      const ensureAudioPlaying = () => {
        const audio = audioRef.current;
        if (!audio || !model.keynoteAudioUrl || isMuted) return;
        if (isVideoSlide) {
          setSafeVolume(0);
        }
        if (audio.paused) {
          audio.play().then(() => {
            setIsAudioBlocked(false);
          }).catch(e => {
            setIsAudioBlocked(true);
          });
        } else {
          setIsAudioBlocked(false);
        }
      };

      // Immediate play on mount
      useEffect(() => {
        const audio = audioRef.current;
        if (!audio || !model.keynoteAudioUrl) return;

        if (isVideoSlide) {
          setSafeVolume(0);
        } else {
          setSafeVolume(0.1);
        }

        audio.play().then(() => {
          setIsAudioBlocked(false);
        }).catch(e => {
          setIsAudioBlocked(true);
        });
      }, [model.keynoteAudioUrl]);

      // Smooth 2-second Audio Fade-In & Fade-Out Controller
      useEffect(() => {
        const audio = audioRef.current;
        if (!audio || !model.keynoteAudioUrl) return;

        if (fadeIntervalRef.current) {
          clearInterval(fadeIntervalRef.current);
          fadeIntervalRef.current = null;
        }

        const shouldHearMusic = isPlaying && !isMuted && !isVideoSlide;
        const FADE_DURATION = 2000;
        const STEP_TIME = 40;
        const step = STEP_TIME / FADE_DURATION;

        if (shouldHearMusic) {
          setIsAudioFading(true);
          if (audio.paused) {
            audio.play().then(() => {
              setIsAudioBlocked(false);
            }).catch(e => {
              setIsAudioBlocked(true);
            });
          }

          fadeIntervalRef.current = setInterval(() => {
            if (!audioRef.current) return;
            const currentVol = audioRef.current.volume;
            if (currentVol < 0.96) {
              setSafeVolume(currentVol + step);
            } else {
              setSafeVolume(1.0);
              setIsAudioFading(false);
              if (fadeIntervalRef.current) {
                clearInterval(fadeIntervalRef.current);
                fadeIntervalRef.current = null;
              }
            }
          }, STEP_TIME);
        } else {
          if (isVideoSlide) {
            setIsAudioFading(true);
            fadeIntervalRef.current = setInterval(() => {
              if (!audioRef.current) return;
              const currentVol = audioRef.current.volume;
              if (currentVol > 0.05) {
                setSafeVolume(currentVol - step * 2);
              } else {
                setSafeVolume(0);
                setIsAudioFading(false);
                if (fadeIntervalRef.current) {
                  clearInterval(fadeIntervalRef.current);
                  fadeIntervalRef.current = null;
                }
              }
            }, STEP_TIME);
          } else if (!isPlaying || isMuted) {
            if (!audio.paused && audio.volume > 0.05) {
              setIsAudioFading(true);
              fadeIntervalRef.current = setInterval(() => {
                if (!audioRef.current) return;
                const currentVol = audioRef.current.volume;
                if (currentVol > 0.08) {
                  setSafeVolume(currentVol - step * 2);
                } else {
                  setSafeVolume(0);
                  audioRef.current.pause();
                  setIsAudioFading(false);
                  if (fadeIntervalRef.current) {
                    clearInterval(fadeIntervalRef.current);
                    fadeIntervalRef.current = null;
                  }
                }
              }, STEP_TIME);
            } else {
              setSafeVolume(0);
              audio.pause();
              setIsAudioFading(false);
            }
          }
        }

        return () => {
          if (fadeIntervalRef.current) {
            clearInterval(fadeIntervalRef.current);
            fadeIntervalRef.current = null;
          }
        };
      }, [isPlaying, isMuted, isVideoSlide, model.keynoteAudioUrl, current]);

      useEffect(() => {
        return () => {
          if (audioRef.current) {
            audioRef.current.pause();
          }
        };
      }, []);

      useEffect(() => {
        if (!isPlaying || slides.length <= 1) {
          setProgress(0);
          return;
        }
        const intervalTime = 50;
        const totalDuration = 5000;
        const step = (intervalTime / totalDuration) * 100;

        const timer = setInterval(() => {
          setProgress(p => {
            if (p >= 100) {
              setCurrent(c => (c + 1) % slides.length);
              return 0;
            }
            return p + step;
          });
        }, intervalTime);

        return () => clearInterval(timer);
      }, [isPlaying, slides.length, current]);

      const handleNext = (e) => {
        if (e) e.stopPropagation();
        ensureAudioPlaying();
        setCurrent(c => (c + 1) % slides.length);
        setProgress(0);
      };

      const handlePrev = (e) => {
        if (e) e.stopPropagation();
        ensureAudioPlaying();
        setCurrent(c => (c - 1 + slides.length) % slides.length);
        setProgress(0);
      };

      const handleRestart = (e) => {
        if (e) e.stopPropagation();
        ensureAudioPlaying();
        setCurrent(0);
        setProgress(0);
      };

      const toggleMute = () => {
        setIsMuted(prev => {
          const next = !prev;
          if (!next) {
            setTimeout(() => {
              const audio = audioRef.current;
              if (audio) {
                audio.play().then(() => setIsAudioBlocked(false)).catch(() => {});
              }
            }, 50);
          }
          return next;
        });
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowRight' || e.key === ' ') {
            ensureAudioPlaying();
            handleNext();
          } else if (e.key === 'ArrowLeft') {
            ensureAudioPlaying();
            handlePrev();
          } else if (e.key === 'Escape') {
            onClose();
          } else if (e.key === 'm' || e.key === 'M') {
            toggleMute();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [slides.length, onClose, isMuted]);

      return (
        <div className="fixed inset-0 z-[100] bg-[#050505] text-white flex items-center justify-center overflow-hidden select-none">
          {model.keynoteAudioUrl && (
            <audio ref={audioRef} src={model.keynoteAudioUrl} loop preload="auto" playsInline />
          )}
          {/* 5-second progress bar */}
          <div className="absolute top-0 left-0 right-0 h-1.5 bg-white/10 z-50 overflow-hidden">
            <div 
              className="h-full transition-all duration-75"
              style={{ 
                width: `${isPlaying ? progress : 0}%`, 
                backgroundColor: model.themeColor || '#fbbf24',
                boxShadow: `0 0 15px ${model.themeColor || '#fbbf24'}`
              }} 
            />
          </div>

          {/* Top Bar */}
          <div className="absolute top-4 left-4 right-4 md:top-6 md:left-8 md:right-8 z-50 flex items-center justify-between pointer-events-none">
            <div className="flex items-center gap-3 bg-black/70 backdrop-blur-xl px-4 py-2 rounded-2xl border border-white/10 pointer-events-auto">
              <img src={model.logoUrl} className="w-6 h-6 object-contain" alt={model.name} />
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-xs font-black uppercase tracking-tight text-white">{model.name}</span>
                  <span className="text-[10px] font-black uppercase tracking-widest px-2 py-0.5 rounded-lg bg-white/10" style={{ color: model.themeColor || '#fbbf24' }}>
                    Keynote
                  </span>
                </div>
                <span className="text-[9px] font-semibold text-slate-400 block">
                  Slide {current + 1} av {slides.length}
                </span>
              </div>
            </div>

            <div className="flex items-center gap-2 md:gap-3 pointer-events-auto">
              {model.keynoteAudioUrl && (
                <div className="hidden sm:flex items-center gap-2 bg-black/70 backdrop-blur-xl px-3 py-1.5 rounded-2xl border border-white/10 text-[10px] font-black uppercase tracking-widest text-slate-300">
                  {isVideoSlide ? (
                    <span className="text-slate-400 flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-slate-500" />
                      Videopresentation // Musik tonas in efter videon
                    </span>
                  ) : isMuted ? (
                    <span className="text-slate-500 flex items-center gap-1.5">
                      <Icon name="volumeX" className="w-3.5 h-3.5" />
                      Ljud avstängt (M)
                    </span>
                  ) : isAudioBlocked ? (
                    <button 
                      onClick={() => {
                        const audio = audioRef.current;
                        if (audio) {
                          setSafeVolume(1.0);
                          audio.play().then(() => setIsAudioBlocked(false)).catch(() => {});
                        }
                      }}
                      className="flex items-center gap-1.5 text-amber-400 font-black cursor-pointer hover:underline"
                    >
                      <Icon name="volume2" className="w-3.5 h-3.5" />
                      Klicka för att starta musik
                    </button>
                  ) : (
                    <span className="flex items-center gap-1.5" style={{ color: model.themeColor || '#fbbf24' }}>
                      <Icon name="volume2" className="w-3.5 h-3.5" />
                      {isAudioFading ? 'Tonar in musik (2s)...' : 'Keynote Soundtrack Aktivt'}
                    </span>
                  )}
                </div>
              )}

              <button 
                onClick={onClose} 
                className="flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-red-950/70 border border-red-500/60 hover:bg-red-900 text-red-200 hover:text-white transition-all shadow-[0_0_25px_rgba(239,68,68,0.3)] font-black text-[11px] uppercase tracking-widest cursor-pointer"
                title="Stäng / Avbryt Keynote (ESC)"
              >
                <Icon name="x" className="w-4 h-4 text-red-400" />
                <span>Stäng (ESC)</span>
              </button>
            </div>
          </div>

          {/* Slide Viewport */}
          <div onClick={handleNext} className="absolute inset-0 flex items-center justify-center cursor-pointer">
            {slide.type === 'HERO' && (
              <div className="relative w-full h-full flex flex-col items-center justify-center text-center p-8 md:p-16">
                <img src={slide.image} className="absolute inset-0 w-full h-full object-cover opacity-25 mix-blend-luminosity filter blur-[2px]" />

    // --- MINI KEYNOTE WIDGET ---
    function MiniKeynoteWidget({ model, onOpenFullscreen }) {
      const slides = useMemo(() => buildModelSlides(model), [model]);
      const [current, setCurrent] = useState(0);
      const [isPlaying, setIsPlaying] = useState(true);
      const [progress, setProgress] = useState(0);

      useEffect(() => {
        if (!isPlaying || slides.length <= 1) {
          setProgress(0);
          return;
        }
        const intervalTime = 50;
        const totalDuration = 5000;
        const step = (intervalTime / totalDuration) * 100;

        const timer = setInterval(() => {
          setProgress(prev => {
            if (prev >= 100) {
              setCurrent(c => (c + 1) % slides.length);
              return 0;
            }
            return prev + step;
          });
        }, intervalTime);

        return () => clearInterval(timer);
      }, [isPlaying, slides.length, current]);

      const handleNext = (e) => {
        if (e) e.stopPropagation();
        setCurrent(c => (c + 1) % slides.length);
        setProgress(0);
      };

      const handlePrev = (e) => {
        if (e) e.stopPropagation();
        setCurrent(c => (c - 1 + slides.length) % slides.length);
        setProgress(0);
      };

      const handleRestart = (e) => {
        if (e) e.stopPropagation();
        setCurrent(0);
        setProgress(0);
      };

            </div>

            <div className="absolute bottom-4 right-4 z-30 flex items-center gap-1.5 bg-black/80 backdrop-blur-md p-1.5 rounded-2xl border border-white/10">
              <button onClick={handlePrev} className="w-8 h-8 rounded-xl bg-white/5 hover:bg-white/20 flex items-center justify-center transition-colors text-white cursor-pointer">

    // --- SMART MEDIA GRID ---
    function SmartMediaGrid({ media, onImageClick }) {

    // --- DYNASTY SHOWREEL (Aura-dynastin Cinema Mode) ---
    function DynastyShowreel({ agency, onClose, initialChapter = 0 }) {
      const getModelAge = (m) => {
        if (m.age) return String(m.age).replace(/[^0-9]/g, '');
        if (m.id === 'astrail-001' || m.name?.toLowerCase().includes('astrail')) return '26';
        if (m.id === 'inga-001' || m.name?.toLowerCase().includes('inga')) return '36';
        if (m.id === 'bodil-001' || m.name?.toLowerCase().includes('bodil')) return '21';
        if (m.id === 'rosie-001' || m.name?.toLowerCase().includes('rosie')) return '32';
        if (m.id === 'alita-001' || m.name?.toLowerCase().includes('alita')) return '28';
        const match = (m.name + ' ' + (m.definition || '') + ' ' + (m.role || '')).match(/((d{2}))/);
        if (match) return match[1];
        return '';
      };

      const chapters = useMemo(() => {
        const list = [];
        if (agency.presentationVideoUrl) {
          list.push({
            id: 'hq-intro',
            title: agency.name || 'Aura Agency',
            age: '',
            role: 'HQ Central // Officiell Agenturpresentation',
            subtitle: 'Konceptuell Översikt & Manifest',
            description: agency.description || 'Välkommen till Aura-dynastins samlade presentationsfilm.',
            videoUrl: agency.presentationVideoUrl,
            themeColor: '#e58e26',
            avatarUrl: agency.logoUrl || '',
            badge: 'HQ Central'
          });
        }
        const modelOrder = ['alita-001', 'astrail-001', 'inga-001', 'bodil-001', 'rosie-001'];
        const sortedModels = [...(agency.models || [])].sort((a, b) => {
          const idxA = modelOrder.indexOf(a.id);
          const idxB = modelOrder.indexOf(b.id);
          if (idxA !== -1 && idxB !== -1) return idxA - idxB;
          if (idxA !== -1) return -1;
          if (idxB !== -1) return 1;
          return 0;
        });

        sortedModels.forEach((m) => {
          const videoUrl = m.showreelVideoUrl || m.secondaryShowreelVideoUrl || (m.professions && m.professions[0]?.presentationVideoUrl);
          if (videoUrl) {
            const ageVal = getModelAge(m);
            const ageStr = ageVal ? ageVal + ' år' : '';
            list.push({
              id: m.id,
              title: m.name,
              age: ageStr,
              role: m.role || 'Modell',
              subtitle: ageStr ? m.role + ' • ' + ageStr : (m.role || 'Modell'),
              description: m.definition || '',
              videoUrl: videoUrl,
              themeColor: m.themeColor || '#fbbf24',
              avatarUrl: m.themeImageUrl || m.logoUrl || '',
              badge: m.name + (ageVal ? ' (' + ageVal + ')' : '')
            });
          }
        });
        return list;
      }, [agency]);

      const [currentIdx, setCurrentIdx] = useState(initialChapter);
      const [isPlaying, setIsPlaying] = useState(true);
      const [isMuted, setIsMuted] = useState(false);
      const [ambientGlow, setAmbientGlow] = useState(true);
      const [progress, setProgress] = useState(0);
      const [duration, setDuration] = useState(0);
      const [currentTime, setCurrentTime] = useState(0);
      const [showPlaylist, setShowPlaylist] = useState(false);

      const videoRef = useRef(null);
      const currentChapter = chapters[currentIdx] || chapters[0];

      useEffect(() => {
        const vid = videoRef.current;
        if (!vid) return;
        vid.muted = isMuted;
        vid.volume = 1.0;
        vid.currentTime = 0;
        setProgress(0);
        setCurrentTime(0);
        vid.play().then(() => setIsPlaying(true)).catch(() => setIsPlaying(false));
      }, [currentIdx]);

      useEffect(() => {
        const vid = videoRef.current;
        if (vid) {
          vid.muted = isMuted;
        }
      }, [isMuted]);

      const handleTimeUpdate = () => {
        const vid = videoRef.current;
        if (!vid || !vid.duration) return;
        setCurrentTime(vid.currentTime);
        setDuration(vid.duration);
        setProgress((vid.currentTime / vid.duration) * 100);
      };

      const handleVideoEnded = () => {
        if (currentIdx < chapters.length - 1) {
          setCurrentIdx(prev => prev + 1);
        } else {
          setCurrentIdx(0);
        }
      };

      const togglePlay = () => {
        const vid = videoRef.current;
        if (!vid) return;
        if (vid.paused) {
          vid.play().then(() => setIsPlaying(true)).catch(() => {});
        } else {
          vid.pause();
          setIsPlaying(false);
        }
      };

      const handleNext = () => {
        setCurrentIdx(prev => (prev + 1) % chapters.length);
      };

      const handlePrev = () => {
        setCurrentIdx(prev => (prev - 1 + chapters.length) % chapters.length);
      };

      const handleSeek = (e) => {
        const vid = videoRef.current;
        if (!vid || !vid.duration) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const newTime = (clickX / rect.width) * vid.duration;
        vid.currentTime = newTime;
        setCurrentTime(newTime);
      };

      const formatTime = (sec) => {
        if (!sec || isNaN(sec)) return '0:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            onClose();
          } else if (e.key === 'ArrowRight') {
            handleNext();
          } else if (e.key === 'ArrowLeft') {
            handlePrev();
          } else if (e.key === ' ' || e.code === 'Space') {
            e.preventDefault();
            togglePlay();
          } else if (e.key === 'm' || e.key === 'M') {
            setIsMuted(prev => !prev);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [chapters.length, isMuted, isPlaying]);

      if (!currentChapter) return null;

      return (
        <div className="fixed inset-0 z-[150] bg-[#030407] text-white flex flex-col justify-between overflow-hidden select-none">
          {/* Dynamic Ambient Spotlight matching model theme */}
          <div className="absolute inset-0 pointer-events-none z-0 overflow-hidden">
            {ambientGlow && (
              <div 
                className={"absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[900px] h-[900px] rounded-full blur-[160px] transition-all duration-1000 " + (isPlaying ? 'opacity-50 scale-105' : 'opacity-25 scale-95')}
                style={{ backgroundColor: currentChapter.themeColor || '#e58e26' }}
              />
            )}
            <div className="absolute inset-0 bg-gradient-to-t from-[#030407] via-transparent to-[#030407]/90" />
          </div>

          {/* Top Header */}
          <div className="relative z-30 flex items-center justify-between p-4 md:p-6 bg-gradient-to-b from-black/90 via-black/50 to-transparent">
            <div className="flex items-center gap-3 md:gap-4">
              <div className="w-10 h-10 md:w-12 md:h-12 rounded-2xl bg-amber-500/20 border border-amber-400/40 flex items-center justify-center text-amber-400 shadow-[0_0_20px_rgba(245,158,11,0.3)] flex-shrink-0">
                <Icon name="film" className="w-5 h-5 md:w-6 md:h-6" />
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] md:text-xs font-black uppercase tracking-widest px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40">
                    Aura-Dynastin
                  </span>
                  <span className="text-[10px] md:text-xs font-black uppercase tracking-widest text-slate-400">
                    Kapitel {currentIdx + 1} av {chapters.length}
                  </span>
                </div>
                <div className="flex items-center gap-2 mt-0.5">
                  <h1 className="text-lg md:text-2xl font-black uppercase italic tracking-tighter text-white drop-shadow-md">
                    {currentChapter.title}
                  </h1>
                  {currentChapter.age && (
                    <span className="text-[11px] md:text-xs font-black not-italic px-2 py-0.5 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/30">
                      {currentChapter.age}
                    </span>
                  )}
                  <span className="text-xs font-normal text-slate-400 not-italic hidden sm:inline">
                    // {currentChapter.role}
                  </span>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2 md:gap-3">
              <button 
                onClick={() => setAmbientGlow(g => !g)}
                className={"hidden sm:flex items-center gap-2 px-3 py-2 rounded-2xl border transition-all text-[11px] font-black uppercase tracking-widest cursor-pointer " + (ambientGlow ? 'bg-amber-950/60 border-amber-500/50 text-amber-300 shadow-[0_0_20px_rgba(245,158,11,0.25)]' : 'bg-black/60 border-white/15 text-slate-400 hover:text-white')}
                title="Växla Ambient Glow biografbelysning"
              >
                <Icon name="sparkles" className="w-3.5 h-3.5 text-amber-400" />
                <span>{ambientGlow ? 'Ambient På' : 'Ambient Av'}</span>
              </button>

              <button
                onClick={() => setShowPlaylist(p => !p)}
                className="hidden sm:flex items-center gap-2 px-3.5 py-2 rounded-2xl bg-black/60 backdrop-blur-md border border-white/15 hover:border-amber-400 text-slate-200 hover:text-white transition-all text-[11px] font-black uppercase tracking-widest cursor-pointer"
              >
                <Icon name="layers" className="w-3.5 h-3.5 text-amber-400" />
                <span>Spellista ({chapters.length})</span>
              </button>

              <button
                onClick={() => setIsMuted(prev => !prev)}
                className={"flex items-center gap-2 px-3.5 md:px-4 py-2 rounded-2xl backdrop-blur-md border transition-all text-[11px] font-black uppercase tracking-widest cursor-pointer " + (isMuted ? 'bg-red-950/70 border-red-500/50 text-red-200' : 'bg-black/60 border-white/15 text-emerald-300 hover:border-emerald-400')}
              >
                <Icon name={isMuted ? "volumeX" : "volume2"} className="w-4 h-4" />
                <span>{isMuted ? 'Ljud Av' : 'Ljud På'}</span>
              </button>

              <button
                onClick={onClose}
                className="flex items-center gap-1.5 md:gap-2 px-3.5 md:px-5 py-2 md:py-2.5 rounded-2xl bg-red-950/80 border border-red-500/60 hover:bg-red-900 text-red-200 hover:text-white transition-all shadow-[0_0_25px_rgba(239,68,68,0.35)] font-black text-[11px] uppercase tracking-widest cursor-pointer"
              >
                <Icon name="x" className="w-4 h-4 text-red-400" />
                <span>Stäng</span>
              </button>
            </div>
          </div>

          {/* Main Video Viewport - Clean & Free of Obstructing Overlays */}
          <div className="relative flex-1 flex flex-col items-center justify-center p-2 md:p-6 overflow-hidden z-10">
            <div 
              onClick={togglePlay} 
              className="relative w-full max-w-6xl aspect-video rounded-[2rem] md:rounded-[3rem] overflow-hidden border border-white/20 shadow-[0_0_100px_rgba(0,0,0,0.95)] bg-black cursor-pointer group"
              style={ambientGlow ? {
                boxShadow: '0 0 70px ' + (currentChapter.themeColor || '#e58e26') + '40, 0 25px 50px -12px rgba(0, 0, 0, 0.9)'
              } : undefined}
            >
              <video
                ref={videoRef}
                src={currentChapter.videoUrl}
                playsInline
                onTimeUpdate={handleTimeUpdate}
                onEnded={handleVideoEnded}

              />

              {!isPlaying && (
                <div className="absolute inset-0 bg-black/40 flex items-center justify-center backdrop-blur-xs">
                  <div className="w-16 h-16 md:w-24 md:h-24 rounded-full bg-amber-500/90 text-black flex items-center justify-center shadow-[0_0_50px_rgba(245,158,11,0.6)] group-hover:scale-110 transition-transform">

                </div>

            {/* Slide-out Playlist Drawer */}
            {showPlaylist && (

                  <button onClick={() => setShowPlaylist(false)} className="text-slate-400 hover:text-white cursor-pointer">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-3 pr-1">
                  {chapters.map((chap, idx) => (
                    <button
                      key={chap.id}
                      onClick={() => setCurrentIdx(idx)}
                      className={"w-full text-left p-3 rounded-2xl border transition-all flex items-center gap-3 cursor-pointer " + (idx === currentIdx ? 'bg-amber-500/20 border-amber-400 text-white shadow-[0_0_20px_rgba(245,158,11,0.2)]' : 'bg-white/5 border-white/10 text-slate-300 hover:bg-white/10')}
                    >
                      <div className="w-10 h-10 rounded-xl overflow-hidden bg-black/40 border border-white/10 flex-shrink-0 flex items-center justify-center">
                        {chap.avatarUrl ? (
                          <img src={chap.avatarUrl} alt="" className="w-full h-full object-cover" />
                        ) : (
                          <Icon name="film" className="w-5 h-5 text-amber-400" />
                        )}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center justify-between">
                          <span className="text-[9px] font-black uppercase tracking-widest" style={{ color: chap.themeColor }}>
                            0{idx + 1} // {chap.badge}
                          </span>
                          {idx === currentIdx && (
                            <span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse" />
                          )}
                        </div>
                        <h4 className="text-xs font-black uppercase italic truncate text-white">{chap.title}</h4>
                        <p className="text-[10px] text-slate-400 truncate">{chap.subtitle}</p>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Bottom Controls & Timeline Bar */}
          <div className="relative z-30 p-4 md:p-6 bg-gradient-to-t from-black/95 via-black/80 to-transparent flex flex-col gap-3">
            {/* Timeline Progress Bar */}
            <div 
              onClick={handleSeek}
              className="w-full h-3 bg-white/10 hover:bg-white/20 rounded-full overflow-hidden cursor-pointer relative group transition-all"
            >
              <div 
                className="h-full bg-gradient-to-r from-amber-500 via-amber-400 to-amber-300 transition-all duration-75 relative"
                style={{ width: progress + '%' }}
              >
                <div className="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow-[0_0_10px_white] opacity-0 group-hover:opacity-100 transition-opacity" />
              </div>
            </div>

            <div className="flex items-center justify-between">
              <div className="flex items-center gap-3">
                <button
                  onClick={handlePrev}
                  className="w-10 h-10 rounded-2xl bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition-colors cursor-pointer"
                  title="Föregående kapitel (Vänsterpil)"
                >
                  <Icon name="chevronLeft" className="w-5 h-5" />
                </button>

                <button
                  onClick={togglePlay}
                  className="px-5 h-10 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-400 text-black font-black text-xs uppercase tracking-widest flex items-center gap-2 hover:scale-105 transition-transform shadow-[0_0_20px_rgba(245,158,11,0.4)] cursor-pointer"
                >
                  <Icon name={isPlaying ? "pause" : "play"} className="w-4 h-4 fill-black" />
                  <span>{isPlaying ? 'Pausa' : 'Spela'}</span>
                </button>

                <button
                  onClick={handleNext}
                  className="w-10 h-10 rounded-2xl bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition-colors cursor-pointer"
                  title="Nästa kapitel (Högerpil)"
                >
                  <Icon name="chevronRight" className="w-5 h-5" />
                </button>

                <span className="text-xs font-mono text-slate-300 ml-2">
                  {formatTime(currentTime)} / {formatTime(duration)}
                </span>
              </div>

              {/* Quick Chapter Selector Pills */}
              <div className="hidden lg:flex items-center gap-2">
                {chapters.map((c, i) => (
                  <button
                    key={c.id}
                    onClick={() => setCurrentIdx(i)}
                    className={"px-3 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all cursor-pointer " + (i === currentIdx ? 'bg-amber-500 text-black shadow-[0_0_15px_rgba(245,158,11,0.5)]' : 'bg-white/5 text-slate-400 hover:text-white hover:bg-white/10')}
                  >
                    0{i + 1} {c.title.split(' ')[0]}
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

                          <span className="text-[10px] font-black uppercase tracking-widest text-white">HQ Central</span>
                        </div>
                      </div>

                      <h2 className="text-5xl font-black uppercase italic tracking-tighter bg-clip-text text-transparent bg-gradient-to-b from-white via-gray-400 to-gray-800 mb-2">

                          <Icon name="layers" className="w-3 h-3" /> Agentur Manifest
                        </h3>
                        <p className="text-sm text-gray-300 leading-relaxed font-medium italic">"{agency.description}"</p>
                      </div>

                      {/* Left Column Quick Showreel Trigger */}
                      <div className="pt-4 border-t border-[#1f222a] mt-4">
                        <button
                          onClick={() => setIsDynastyShowreelOpen(true)}
                          className="w-full flex items-center justify-between p-3.5 rounded-2xl bg-gradient-to-r from-amber-500/15 via-purple-500/10 to-pink-500/15 border border-amber-500/40 hover:border-amber-400 text-slate-200 hover:text-white transition-all shadow-[0_0_20px_rgba(245,158,11,0.15)] group cursor-pointer"
                        >
                          <div className="flex items-center gap-3">
                            <div className="w-8 h-8 rounded-xl bg-amber-500/20 flex items-center justify-center text-amber-400 group-hover:scale-110 transition-transform">
                              <Icon name="film" className="w-4 h-4" />
                            </div>
                            <div className="text-left">
                              <span className="text-[9px] font-black uppercase tracking-widest text-amber-400 block">Aura-Dynastin</span>
                              <span className="text-xs font-black uppercase tracking-tight text-white">Familje-Showreel</span>
                            </div>
                          </div>
                          <div className="w-7 h-7 rounded-full bg-amber-500/20 group-hover:bg-amber-500 group-hover:text-black text-amber-400 flex items-center justify-center transition-all">
                            <Icon name="play" className="w-3.5 h-3.5" />
                          </div>
                        </button>
                      </div>

                      {allCompanyMedia.length > 0 && (
                        <div className="pt-4 border-t border-[#1f222a] mt-4">
                          <button 
                            onClick={() => setShowCompanyCollage(!showCompanyCollage)}
                            className="text-xs font-bold text-slate-300 hover:text-white transition-colors flex items-center gap-2 group cursor-pointer text-left w-full"
                          >
                            <Icon name="image" className="w-3.5 h-3.5" style={{ color: 'var(--theme-color)' }} />
                            <span className="underline decoration-slate-600 underline-offset-4 group-hover:decoration-[var(--theme-color)]">
                              {showCompanyCollage ? 'Dölj företagskollage' : 'Visa företagskollage (' + allCompanyMedia.length + ' st)'}

                            <span className="ml-auto">
                              <Icon name={showCompanyCollage ? "chevronUp" : "chevronDown"} className="w-3.5 h-3.5 text-slate-500" />
                            </span>
                          </button>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Right Column: Roster & Models */}
                  <div className="xl:col-span-8 flex flex-col gap-8">
                    {/* Dynasty Showreel Hero Card */}
                    <div className="bg-gradient-to-r from-amber-950/40 via-[#161d2b] to-pink-950/40 rounded-[3rem] p-6 md:p-8 border border-amber-500/30 hover:border-amber-400/60 transition-all shadow-[0_0_35px_rgba(245,158,11,0.12)] flex flex-col md:flex-row items-center justify-between gap-6 group">
                      <div className="flex items-center gap-5">
                        <div className="w-14 h-14 rounded-3xl bg-amber-500/15 border border-amber-400/30 flex items-center justify-center text-amber-400 shadow-[0_0_20px_rgba(245,158,11,0.25)] group-hover:scale-105 transition-transform flex-shrink-0">
                          <Icon name="film" className="w-7 h-7" />
                        </div>
                        <div>
                          <div className="flex items-center gap-2 mb-1">
                            <span className="text-[10px] font-black uppercase tracking-widest px-2.5 py-0.5 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30">
                              Aura-Dynastin • Cinema Mode
                            </span>
                            <span className="text-[10px] font-black uppercase tracking-widest text-slate-400">
                              HQ + 4 Modeller
                            </span>
                          </div>
                          <h2 className="text-2xl md:text-3xl font-black uppercase italic tracking-tighter text-white drop-shadow-md">
                            Familje-Showreel
                          </h2>
                          <p className="text-xs md:text-sm text-slate-300 font-medium mt-1">
                            Spela alla videopresentationer i följd med fullt ljud (HQ, Astrail 26 år, Inga 36 år, Bodil 21 år, Rosie 32 år).
                          </p>
                        </div>
                      </div>
                      <button
                        onClick={() => setIsDynastyShowreelOpen(true)}
                        className="w-full md:w-auto px-7 py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-black font-black text-xs uppercase tracking-widest shadow-[0_0_30px_rgba(245,158,11,0.4)] flex items-center justify-center gap-2.5 cursor-pointer whitespace-nowrap transition-transform hover:scale-105"
                      >
                        <Icon name="play" className="w-4 h-4" />
                        <span>Starta Showreel</span>
                      </button>
                    </div>

                    {agency.presentationVideoUrl && (
                      <div className="bg-gradient-to-br from-[#1f222a] to-[#0f1115] rounded-[3rem] p-4 border border-[#2a2d35] shadow-[0_20px_40px_rgba(0,0,0,0.6)]">
                        <div className="rounded-[2.5rem] overflow-hidden relative border border-[#1f222a] aspect-video">
                          <video src={agency.presentationVideoUrl} controls autoPlay loop muted playsInline className="w-full h-full object-cover" />
                          <div className="absolute top-6 left-6 flex items-center gap-2 pointer-events-none">
                            <Icon name="sparkles" className="w-4 h-4 text-[#fbbf24]" />
                            <span className="text-[10px] font-black uppercase tracking-widest text-white drop-shadow-md">Officiell Presentation</span>
                          </div>
                        </div>
                      </div>
                    )}

                    {showCompanyCollage && allCompanyMedia.length > 0 && (
                      <div className="bg-gradient-to-br from-[#1f222a] to-[#0f1115] rounded-[3rem] p-6 md:p-8 border border-[#2a2d35] shadow-2xl">

                            <Icon name="image" className="w-4 h-4" style={{ color: 'var(--theme-color)' }} />
                            Företagskollage // Logotyp & Affischer
                          </h3>
                          <button onClick={() => setShowCompanyCollage(false)} className="text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-white flex items-center gap-1 px-3 py-1.5 rounded-xl bg-[#0a0b0e] border border-[#2a2d35]">
                            <Icon name="x" className="w-3 h-3" /> Stäng

                    )}

                        style={{ '--hover-color': model.themeColor || '#fbbf24' }}
                      >
                        <div className="border-b border-[#2a2d35] pb-6 flex items-start justify-between cursor-pointer" onClick={() => { setActiveModel(model); setActiveTab('COLLAGE'); }}>
                          <div>
                            <span className="text-[10px] font-black uppercase tracking-widest mb-2 block" style={{ color: model.themeColor || '#fbbf24' }}>DNA ID: {model.id}</span>

                        </div>

                        <div className="flex flex-col md:flex-row gap-8">
                          <div className="w-full md:w-1/3 aspect-[4/5] rounded-[2rem] overflow-hidden relative border border-[#1f222a] cursor-pointer" onClick={() => { setActiveModel(model); setActiveTab('COLLAGE'); }}>
                            <img src={model.themeImageUrl} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" alt={model.name} />

                            <div className="absolute bottom-4 left-4">
                              <span className="text-[10px] font-black uppercase tracking-widest text-white drop-shadow-md">{model.role}</span>
                            </div>

                            <div className="mb-6">
                              <h4 className="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Kärnvärden</h4>
                              <div className="flex flex-wrap gap-2">

                                    <span className="text-[10px] font-black" style={{ color: 'var(--theme-color)' }}>0{idx + 1}</span> {prof.title}
                                  </button>
                                </li>
                              ))}
                            </ul>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>

                    <MiniKeynoteWidget

                        setKeynoteStartSlide(startIdx);
                        setShowKeynote(true);
                      }} 
                    />

                    {/* Showreels */}
                    {(activeModel.showreelVideoUrl || activeModel.secondaryShowreelVideoUrl) && (
                      <div className="flex flex-col gap-6">
                        {activeModel.showreelVideoUrl && (
                          <div className="bg-gradient-to-br from-[#1f222a] to-[#0f1115] rounded-[3rem] p-4 border border-[#2a2d35] shadow-2xl">
                            <div className="rounded-[2.5rem] overflow-hidden relative border border-[#1f222a] aspect-video">
                              <video src={activeModel.showreelVideoUrl} controls autoPlay loop muted playsInline className="w-full h-full object-cover" />
                              <div className="absolute top-6 left-6 flex items-center gap-2 pointer-events-none bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-xl border border-white/10">
                                <Icon name="play" className="w-4 h-4" style={{ color: activeModel.themeColor || '#fbbf24' }} />
                                <span className="text-[10px] font-black uppercase tracking-widest text-white">Presentationsfilm 1</span>
                              </div>
                            </div>
                          </div>
                        )}

                        {activeModel.secondaryShowreelVideoUrl && (
                          <div className="bg-gradient-to-br from-[#1f222a] to-[#0f1115] rounded-[3rem] p-4 border border-[#2a2d35] shadow-2xl">

                              <video src={activeModel.secondaryShowreelVideoUrl} controls autoPlay loop muted playsInline className="w-full h-full object-cover" />
                              <div className="absolute top-6 left-6 flex items-center gap-2 pointer-events-none bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-xl border border-white/10">
                                <Icon name="play" className="w-4 h-4" style={{ color: activeModel.themeColor || '#fbbf24' }} />
                                <span className="text-[10px] font-black uppercase tracking-widest text-white">Presentationsfilm 2 (Vit Klänning / Showcase)</span>
                              </div>
                            </div>
                          </div>
                        )}
                      </div>
                    )}

                    {/* Professions */}
                    {(activeModel.professions || []).map((prof, index) => (
                      <div 
                        id={`profession-${prof.id}`}
                        key={prof.id} 
                        className="bg-gradient-to-br from-[#1f222a] to-[#0f1115] rounded-[3rem] p-8 border border-[#2a2d35] shadow-[0_20px_40px_rgba(0,0,0,0.6)] flex flex-col gap-6 scroll-mt-8"
                      >
                        <div className="border-b border-[#2a2d35] pb-6 flex items-start justify-between">
                          <div>
                            <span className="text-[10px] font-black uppercase tracking-widest mb-2 block" style={{ color: 'var(--theme-color)' }}>Kollektion / Yrke 0{index + 1}</span>
                            <h3 className="text-4xl font-black uppercase italic tracking-tighter text-white">{prof.title}</h3>
                          </div>
                        </div>

                        {prof.presentationVideoUrl && (
                          <div className="rounded-[2.5rem] overflow-hidden relative border border-[#1f222a] aspect-video w-full shadow-2xl mb-2">
                            <video src={prof.presentationVideoUrl} controls autoPlay loop muted playsInline className="w-full h-full object-cover" />
                          </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 text-sm text-slate-300 font-medium leading-relaxed">
                          <div>
                            <h4 className="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Beskrivning</h4>
                            <p>{prof.description}</p>
                          </div>
                          <div>
                            <h4 className="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Historik & Erfarenhet</h4>
                            <p>{prof.history}</p>
                          </div>
                        </div>

                        <div className="mt-4">
                          <SmartMediaGrid media={prof.media} onImageClick={setLightboxImage} />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* Lightbox */}
          {lightboxImage && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-md p-4 md:p-12 cursor-pointer" onClick={() => setLightboxImage(null)}>
              <button className="absolute top-8 right-8 text-white hover:text-[var(--theme-color)] transition-colors z-50 p-2" onClick={(e) => { e.stopPropagation(); setLightboxImage(null); }}>
                <Icon name="x" className="w-8 h-8" />
              </button>
              <img src={lightboxImage} alt="Fullscreen" className="max-w-full max-h-full object-contain rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.8)]" />
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
